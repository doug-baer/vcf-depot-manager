services:
  vcfdt-depot:
    build: .
    image: vcf-depot-manager:latest
    container_name: vcf-depot-manager
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      # Persistent depot store - survives container rebuilds
      - depot_data:/data/depot
      # Token files (rotated via web UI)
      - token_data:/data/tokens
      # Job logs and gunicorn logs
      - log_data:/data/logs
      # Full VCFDT directory with all binaries, configs, etc. (needs RW so that it can update configs)
      - ./bin/vcfdt:/opt/vcfdt
    networks:
      - depot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: NGINX reverse proxy for TLS termination
  nginx:
    image: nginx:alpine
    container_name: vcf-depot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      vcfdt-depot:
        condition: service_healthy
    networks:
      - depot-net

volumes:
  depot_data:
    driver: local
  token_data:
    driver: local
  log_data:
    driver: local

networks:
  depot-net:
    driver: bridge