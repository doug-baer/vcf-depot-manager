user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    upstream vcfdt_app {
        server vcfdt-depot:5000;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        # VCFDT web UI (authenticated via app's basic auth)
        location / {
            proxy_pass http://vcfdt_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Depot file serving (this is what SDDC Manager / vRSLCM will hit)
        # No basic auth here - SDDC Manager won't authenticate
        # Protect with network-level ACLs or client certificate auth instead
        location /depot/files/ {
            alias /data/depot/;
            autoindex on;
            autoindex_format json;
        }
    }
}