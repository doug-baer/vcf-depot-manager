<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VCF Depot Manager{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">VCF Depot Manager</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
            <a href="{{ url_for('configuration.configuration_page') }}">Configuration</a>
            <a href="{{ url_for('depot.browse') }}">Depot</a>
            <a href="{{ url_for('list_updates.list_updates') }}">List Updates</a>
            <a href="{{ url_for('downloads.downloads_page') }}">Downloads</a>
            <a href="{{ url_for('jobs.list_jobs') }}">Jobs</a>
        </div>
    </nav>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
